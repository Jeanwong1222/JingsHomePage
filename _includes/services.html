<!-- services.html -->
{% for service in site.data.services %}
<div style="margin-bottom: 1em;">
  <div style="font-weight: bold;">{{ service.title }}</div>
  {% for item in service.items %}
    {% if item.name %}
    <div style="margin-left: 1em; margin-bottom: 0.4em;">• {{ item.name }}</div>
      {% for sub in item.subitems %}
    <div style="margin-left: 2.5em; margin-bottom: 0.3em;">– {{ sub }}</div>
      {% endfor %}
    {% else %}
    <div style="margin-left: 1em; margin-bottom: 0.4em;">• {{ item }}</div>
    {% endif %}
  {% endfor %}
</div>
{% endfor %}
